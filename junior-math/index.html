eight:57px;margin:14px 0 4px;font-weight:700}.feedback.good{color:#126544}.feedback.bad{color:#ae3f26}.feedback small{display:block;font-size:.95rem;font-weight:500;color:#38566d;margin-top:5px}.actions{display:flex;gap:10px;flex-wrap:wrap}.guide{border-top:1px solid #e1eaf2;margin-top:28px;padding-top:15px;color:#38546c}.guide h2{font-size:1.05rem;color:#173751}.guide ul{padding-left:1.4em;line-height:1.8}.guide li{margin:4px 0}footer{color:#5a7085;text-align:center;padding:0 18px 28px;font-size:.9rem}@media(max-width:620px){.tabs{grid-template-columns:1fr}.tab{text-align:left;padding:12px 16px}.panel{padding:20px}.answer input{flex:1;min-width:150px}.answer .primary{flex:1}.question{overflow-wrap:anywhere}}

.group-title{margin:26px 0 12px;font-size:1.12rem}.levels{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.level{border:1px solid #c8d9e8;background:#f2f7fb;border-radius:10px;padding:9px 16px;font-weight:700;color:#31536f}.level[aria-pressed=true]{background:#176cae;color:#fff;border-color:#176cae}.context{font-size:1.08rem;line-height:1.6;color:#385873;margin-bottom:9px}.result{background:#f2f8ff;border-radius:16px;padding:22px;margin-top:20px}.result strong{font-size:1.5rem}.tipcard p{line-height:1.7;margin:7px 0}.example{font-weight:700;color:#185688}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 8px}.choice{border:2px solid #c7d9e9;border-radius:13px;background:#fff;color:#184468;padding:15px;font-size:1.3rem;font-weight:750;min-height:64px;font-variant-numeric:tabular-nums}.choice:hover:not(:disabled),.choice:focus-visible{border-color:#1673b6;background:#ecf7ff}.choice.correct{border-color:#218764;background:#e7f7ef;color:#126345}.choice.wrong{border-color:#c6533a;background:#fff0eb;color:#9d321e}.choice:disabled{cursor:default}@media(max-width:520px){.choices{gap:8px}.choice{font-size:1.12rem;padding:11px;min-height:58px}}.fraction{display:inline-grid;grid-template-rows:auto auto;vertical-align:middle;text-align:center;line-height:1.05;font-size:.82em;margin:0 .13em;white-space:nowrap;font-variant-numeric:tabular-nums}.fraction-top{border-bottom:1.5px solid currentColor;padding:0 .15em .1em}.fraction-bottom{padding:.1em .15em 0}.choice .fraction{font-size:1em}.prime-pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:13px 0 3px}.prime-pad button{border:1.5px solid #b9d2e6;background:#f2f8fd;color:#164e7b;border-radius:11px;min-height:53px;font-weight:750;font-size:1.1rem}.prime-pad button:hover:not(:disabled),.prime-pad button:focus-visible{border-color:#1673b6;background:#e2f2ff}.prime-pad button[data-prime-action]{font-size:.95rem;background:#e9f1f8}.prime-pad button:disabled{opacity:.55;cursor:default}.answer input[readonly]{background:#fff;cursor:default}.answer input[readonly]:focus{outline:none}@media(max-width:520px){.prime-pad{gap:7px}.prime-pad button{min-height:50px;font-size:1rem}.prime-pad button[data-prime-action]{font-size:.83rem}}[hidden]{display:none!important}</style></head><body><header><strong>計算力トレーニング</strong></header><main><section id="home" aria-labelledby="home-title"><div class="homehead"><h1 id="home-title">練習する単元を選ぶ</h1><p>1回10問。練習したい内容を選んでください。</p></div><h2 class="group-title">中1の基礎</h2><div class="menu"><button class="menucard" type="button" data-open="multiply"><span class="menunum">01　暗算</span><strong>19×19までの暗算</strong><span>掛け算をテンポよく練習</span></button><button class="menucard" type="button" data-open="factor"><span class="menunum">02　整数</span><strong>素因数分解</strong><span>素数の積で表す練習</span></button><button class="menucard" type="button" data-open="decimal"><span class="menunum">03　小数</span><strong>計算の工夫</strong><span>0.25や0.125などを使う計算</span></button><button class="menucard" type="button" data-open="convert"><span class="menunum">数の変換</span><strong>小数⇔分数</strong><span>頻出の数を瞬時に変換</span></button><button class="menucard" type="button" data-open="round"><span class="menunum">暗算の工夫</span><strong>25・125でキリよく</strong><span>100や1000を作る暗算</span></button></div><h2 class="group-title">中2の式</h2><div class="menu"><button class="menucard" type="button" data-open="common"><span class="menunum">式の工夫</span><strong>共通因数を見つける</strong><span>同じ数をくくって計算</span></button><button class="menucard" type="button" data-open="coefficient"><span class="menunum">式の計算</span><strong>単項式の係数を先に計算</strong><span>符号と係数をまとめる</span></button></div><h2 class="group-title">中3・入試</h2><div class="menu"><button class="menucard" type="button" data-open="squares"><span class="menunum">入試の計算</span><strong>平方数を覚える</strong><span>2乗と平方根の逆引き</span></button><button class="menucard" type="button" data-open="difference"><span class="menunum">入試の計算</span><strong>平方差で暗算</strong><span>2乗の差を和と差の積に</span></button><button class="menucard" type="button" data-open="pythagoras"><span class="menunum">入試の計算</span><strong>ピタゴラス数</strong><span>直角三角形の整数比</span></button><button class="menucard" type="button" data-open="parabola"><span class="menunum">入試の計算</span><strong>放物線と直線</strong><span>傾きと切片を求める</span></button><button class="menucard" type="button" data-open="substitute"><span class="menunum">入試の計算</span><strong>代入前に式を整理</strong><span>先に形を見抜いて計算</span></button><button class="menucard" type="button" data-open="area"><span class="menunum">入試の計算</span><strong>放物線と三角形の面積</strong><span>切片と横幅から面積</span></button></div><div class="tipsentry"><h2>解き方を確認する</h2><button class="menucard" type="button" data-open="tips"><span class="menunum">まとめ</span><strong>計算のコツ</strong><span>各単元の考え方を読む</span></button></div></section><section id="practice" class="panel" aria-labelledby="title" hidden><button class="back" type="button" data-open="home">← 目次に戻る</button><div class="topline"><h1 id="title"></h1><span class="badge" id="score" aria-live="polite"></span></div><p class="hint" id="description"></p><div class="levels" role="group" aria-label="難易度"><button class="level" type="button" data-level="1">基礎</button><button class="level" type="button" data-level="2">標準</button><button class="level" type="button" data-level="3">発展</button></div><div id="question-area"><div class="card"><div id="context" class="context"></div><div class="prompt" id="prompt"></div><div class="question" id="question"></div></div><form id="form" class="answer" autocomplete="off"><input id="input" type="text" inputmode="numeric" aria-label="答え" spellcheck="false"><button class="primary" type="submit">答え合わせ</button></form><div id="prime-pad" class="prime-pad" role="group" aria-label="素因数分解の入力ボタン" hidden><button type="button" data-prime="2">2</button><button type="button" data-prime="3">3</button><button type="button" data-prime="5">5</button><button type="button" data-prime="7">7</button><button type="button" data-prime="11">11</button><button type="button" data-prime="13">13</button><button type="button" data-prime-action="undo">1つ戻す</button><button type="button" data-prime-action="clear">全部消す</button></div><div id="choices" class="choices" role="group" aria-label="答えの選択肢" hidden></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions"><button id="next" class="secondary" type="button">次の問題</button><button id="reveal" class="secondary" type="button">答えを見る</button></div></div><div id="result" class="result" hidden><strong id="result-title"></strong><p id="result-detail"></p><button id="retry" class="primary" type="button">同じ分野でもう10問</button></div></section><section id="tips" class="panel" aria-labelledby="tips-title" hidden><button class="back" type="button" data-open="home">← 目次に戻る</button><h1 id="tips-title">計算のコツ</h1><div class="tipslist" id="tiplist"></div></section></main><footer>入力した答えや記録は送信されません。</footer><script>

(()=>{'use strict';
const $=id=>document.getElementById(id), E={home:$('home'),practice:$('practice'),tips:$('tips'),title:$('title'),score:$('score'),description:$('description'),prompt:$('prompt'),question:$('question'),context:$('context'),input:$('input'),feedback:$('feedback'),next:$('next'),reveal:$('reveal'),form:$('form'),primePad:$('prime-pad'),choices:$('choices'),tiplist:$('tiplist'),area:$('question-area'),result:$('result'),resultTitle:$('result-title'),resultDetail:$('result-detail'),retry:$('retry')};
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),P=a=>a[R(0,a.length-1)],F=(n,d=1)=>{let a=Math.abs(n),b=d;while(b)[a,b]=[b,a%b];return {n:n/a,d:d/a}},S=f=>f.d===1?String(f.n):`${f.n}/${f.d}`,Q=(text,answer,explain,other={})=>({text,answer,explain,...other});
const decimals=[['0.2',1,5],['0.4',2,5],['0.5',1,2],['0.25',1,4],['0.75',3,4],['0.125',1,8],['0.375',3,8],['0.625',5,8],['0.875',7,8],['1.25',5,4],['1.5',3,2]],triples=[[3,4,5],[5,12,13],[8,15,17],[7,24,25]];
const modes={
multiply:{title:'19×19までの暗算',desc:'掛け算を暗算で答えましょう。',tip:'十の位と一の位に分ける。20に近い数なら20から引く。',example:'17×8＝10×8＋7×8＝136。19×19＝20×19−19＝361。',make:l=>{let a=R(l===1?2:11,19),b=R(l===1?2:l===2?2:11,l===1?12:19);return Q(`${a} × ${b}`,a*b,`${a}×${b}＝${a*b}`)}},
factor:{title:'素因数分解',desc:'素数ボタンを順に押してください。掛け算の記号は自動で入ります。',tip:'小さい素数から割り、最後に素数だけの積になっているか確認する。',example:'60＝2×2×3×5＝2²×3×5。',make:l=>{let primes=l===1?[2,3,5]:l===2?[2,3,5,7]:[2,3,5,7,11,13],fs,n;do{fs=[];n=1;let count=R(2,l+2);for(let i=0;i<count;i++){let possible=primes.filter(p=>p*n<=500);if(!possible.length)break;let p=P(possible);fs.push(p);n*=p}}while(n<20||fs.length<2);fs.sort((a,b)=>a-b);return Q(String(n),fs,`${n}＝${fs.join('×')}`,{kind:'factor'})}},
decimal:{title:'小数を使う計算',desc:'分数に直すと簡単になる小数の掛け算。',tip:'0.25＝1/4、0.75＝3/4。0.125＝1/8、0.375＝3/8、0.625＝5/8、0.875＝7/8。',example:'0.375×16＝(3/8)×16＝6。',make:l=>{let row=P(decimals.slice(l===1?2:0,l===1?5:l===2?9:11)),k=R(2,l===1?6:12),b=row[2]*k;return Q(`${row[0]} × ${b}`,row[1]*k,`${row[0]}＝${row[1]}/${row[2]}、${row[1]}×${k}＝${row[1]*k}`)}},
round:{title:'25・125でキリよく',desc:'100や1000を作って暗算。',tip:'25×4＝100、125×8＝1000、50×2＝100を見つける。',example:'125×24＝125×8×3＝3000。',make:l=>{let a=l===1?25:l===2?P([25,50,125]):P([25,125,0.125]),unit=a===25?4:a===50?2:8,k=R(2,14),b=unit*k;return Q(`${a} × ${b}`,a*b,`${a}×${unit}×${k}＝${a*unit}×${k}＝${a*b}`)}},
common:{title:'共通因数を見つける',desc:'同じ数をくくって暗算。',tip:'a×b＋a×c＝a(b＋c)。差なら a×b−a×c＝a(b−c)。',example:'37×18＋37×82＝37×100＝3700。',make:l=>{let a=P(l===1?[12,15,25]:l===2?[19,25,37]:[37,48,75,125]),b=R(11,45),sum=P([50,100,120]),c=sum-b;if(l===3&&Math.random()<.4){c=R(2,b-1);return Q(`${a}×${b} − ${a}×${c}`,a*(b-c),`${a}×(${b}−${c})＝${a*(b-c)}`)}return Q(`${a}×${b} ＋ ${a}×${c}`,a*sum,`${a}×(${b}＋${c})＝${a*sum}`)}},
convert:{title:'小数⇔分数',desc:'4つの選択肢から正しい変換を選びましょう。',tip:'0.25＝1/4、0.75＝3/4。0.125＝1/8、0.375＝3/8、0.625＝5/8、0.875＝7/8。',example:'0.625＝5/8。5/4＝1.25。',make:l=>{let row=P(decimals.slice(0,l===1?5:l===2?9:11)),rev=l>1&&Math.random()<.5;return rev?Q(`${row[1]}/${row[2]} を小数に`,Number(row[0]),`${row[1]}/${row[2]}＝${row[0]}`):Q(`${row[0]} を分数に`,F(row[1],row[2]),`${row[0]}＝${row[1]}/${row[2]}`,{kind:'rationalOnly'})}},
squares:{title:'平方数を覚える',desc:'2乗と平方根を逆引き。',tip:'11²〜25²を両方向に覚えると、平方根や三平方の計算が速くなる。',example:'17²＝289、√289＝17。',make:l=>{let n=R(l===3?16:11,l===1?16:l===2?25:30);return Math.random()<.5?Q(`√${n*n}`,n,`√${n*n}＝${n}`):Q(`${n}²`,n*n,`${n}²＝${n*n}`)}},
difference:{title:'平方差で暗算',desc:'2乗の差を和と差の積に。',tip:'A²−B²＝(A＋B)(A−B)。100前後の積にも使える。',example:'103×97＝(100＋3)(100−3)＝10000−9＝9991。',make:l=>{let a=P(l===1?[20,30,50]:[50,60,75,95,100]),b=R(2,l===1?9:15),v=l===1?0:R(0,l===2?1:2);if(v===1)return Q(`${a+b} × ${a-b}`,a*a-b*b,`(${a}＋${b})(${a}−${b})＝${a}²−${b}²＝${a*a-b*b}`);if(v===2){let c=P([30,40,50]),d=R(2,9),ans=a*a-b*b+c*c-d*d;return Q(`${a}² − ${b}² ＋ ${c}² − ${d}²`,ans,`(${a}＋${b})(${a}−${b})＋(${c}＋${d})(${c}−${d})＝${ans}`)}return Q(`${a}² − ${b}²`,a*a-b*b,`(${a}＋${b})(${a}−${b})＝${a*a-b*b}`)}},
pythagoras:{title:'ピタゴラス数',desc:'直角三角形の残りの1辺を答えましょう。',tip:'3:4:5、5:12:13、8:15:17、7:24:25を覚え、整数倍にも気づく。',example:'斜辺13、他の1辺5なら残りは12。6:8:10は3:4:5の2倍。',make:l=>{let t=P(triples.slice(0,l===1?2:l===2?3:4)),k=R(l===1?1:2,l===1?1:l===2?3:5),[a,b,c]=t.map(x=>x*k),missing=R(0,2),hint=`${a}:${b}:${c}＝${t.join(':')} の ${k} 倍`;return missing===2?Q(`直角をはさむ2辺が ${a}, ${b}。斜辺は？`,c,hint):Q(`斜辺が ${c}、他の1辺が ${missing===0?b:a}。残りは？`,missing===0?a:b,hint)}},
parabola:{title:'放物線と直線',desc:'傾き・切片は整数または分数で答えられます。',tip:'y＝ax² 上の x＝α, β を通る直線は、傾き m＝a(α＋β)、切片 n＝−aαβ。ただし α≠β。',example:'y＝(1/2)x²、α＝−3、β＝2 → m＝−1/2、n＝3。',make:l=>{let a=l===1?F(1):P(l===2?[F(1),F(2),F(1,2)]:[F(1,2),F(3,2),F(2)]),alpha=R(-5,-1),beta=R(1,5);if(beta===-alpha)beta++;let m=F(a.n*(alpha+beta),a.d),n=F(-a.n*alpha*beta,a.d),type=l===3?P(['slope','intercept','reverse']):P(['slope','intercept']);if(type==='reverse')return Q(`傾きが ${S(m)} のとき、a の値は？`,a,`a＝${S(m)}÷(${alpha}＋${beta})＝${S(a)}`,{kind:'fraction',context:`y＝ax² 上の x＝${alpha}, ${beta} を通る直線`});let context=`y＝${S(a)}x² 上の x＝${alpha}, ${beta} を通る直線`;return type==='slope'?Q('直線の傾きは？',m,`m＝${S(a)}×(${alpha}＋${beta})＝${S(m)}`,{kind:'fraction',context}):Q('直線の y 切片は？',n,`n＝−${S(a)}×(${alpha})×${beta}＝${S(n)}`,{kind:'fraction',context})}},
substitute:{title:'代入前に式を整理',desc:'直接代入する前に式の形を見抜く。',tip:'先に平方式や平方差へ直す。x＝√n＋b なら x−b＝√n に注目。',example:'x＝√17＋4 のとき x²−8x＋15＝(x−4)²−1＝16。',make:l=>{if(l<3){let n=R(2,23),b=R(1,6),k=l===1?0:R(-5,5),constant=b*b+k;return Q(`x² − ${2*b}x ${constant<0?'−':'＋'} ${Math.abs(constant)}`,n+k,`(x−${b})²${k<0?'−':'＋'}${Math.abs(k)}＝${n+k}`,{context:`x＝√${n}＋${b} のとき、次の式の値は？`})}let sum=R(7,19),product=R(2,20);return Q('x² ＋ y²',sum*sum-2*product,`(x＋y)²−2xy＝${sum}²−2×${product}＝${sum*sum-2*product}`,{context:`x＋y＝${sum}、xy＝${product} のとき、次の式の値は？`})}}
,coefficient:{title:'単項式の係数を先に計算',desc:'符号と数の部分を分けて処理。',tip:'単項式の乗除は、符号を先に決め、係数を1つの分数にまとめて約分する。文字の指数は別に計算する。',example:'(−6a²b)×(4ab²)÷(3a²b) の係数は −6×4÷3＝−8。',make:l=>{let c=P(l===1?[2,3,4,6]:[3,4,6,8,9]),d=P(l===1?[2,3,4]:[4,6,8,12]),e=P([2,3,4,6].filter(x=>c*d%x===0)),sign=l===1?1:P([-1,1]),n=sign*c*d/e,lead=sign<0?'−':'',text=`(${lead}${c}a²b) × (${d}ab²) ÷ (${e}a²b)`;return Q(text,n,`係数だけを取り出すと (${sign*c})×${d}÷${e}＝${n}`,{context:'計算結果の係数を求めましょう。'})}},
area:{title:'放物線と三角形の面積',desc:'原点と放物線上の2点が作る面積。',tip:'原点 O と放物線上の2点 A, B の三角形は、AB の直線の y 切片 n を使い S＝|n|×|β−α|÷2。',example:'y＝(1/2)x²、α＝−3、β＝2 → 切片 n＝3、面積は 3×5÷2＝15/2。',make:l=>{let a=l===1?F(1):P(l===2?[F(1),F(2)]:[F(1,2),F(3,2),F(2)]),alpha=R(-4,-1),beta=R(1,5),n=F(-a.n*alpha*beta,a.d),area=F(Math.abs(n.n)*(beta-alpha),2*n.d);return Q('△OAB の面積は？',area,`AB の y 切片は ${S(n)}。面積＝${S(n)}×(${beta}−${alpha})÷2＝${S(area)}`,{kind:'fraction',context:`O は原点。A, B は y＝${S(a)}x² 上の x＝${alpha}, ${beta} の点。`})}}
};
let mode=null,level=1,current=null,index=0,correct=0,missed=0,done=false,seen=new Set();
function mathText(element,source){let raw=String(source),regex=/(-?\d+)\/(\d+)/g,fragment=document.createDocumentFragment(),last=0,match;element.replaceChildren();while((match=regex.exec(raw))){fragment.append(document.createTextNode(raw.slice(last,match.index)));let fraction=document.createElement('span'),top=document.createElement('span'),bottom=document.createElement('span');fraction.className='fraction';fraction.setAttribute('role','img');fraction.setAttribute('aria-label',`${match[2]}分の${match[1]}`);top.className='fraction-top';bottom.className='fraction-bottom';top.setAttribute('aria-hidden','true');bottom.setAttribute('aria-hidden','true');top.textContent=match[1];bottom.textContent=match[2];fraction.append(top,bottom);fragment.append(fraction);last=regex.lastIndex}fragment.append(document.createTextNode(raw.slice(last)));element.append(fragment)}
for(const [id,m] of Object.entries(modes)){let card=document.createElement('article');card.className='tipcard';let h=document.createElement('h2');h.textContent=m.title;let p=document.createElement('p');mathText(p,m.tip);let ex=document.createElement('p');ex.className='example';mathText(ex,'例：'+m.example);card.append(h,p,ex);E.tiplist.append(card)}
function factors(n){let out=[];for(let d=2;d*d<=n;d++)while(n%d===0){out.push(d);n/=d}if(n>1)out.push(n);return out}
function parse(s){s=s.normalize('NFKC').replace(/[−ー－]/g,'-').replace(/\s/g,'');let m=s.match(/^([+-]?\d+)(?:\/([+-]?\d+))?$/);if(m){let n=Number(m[1]),d=Number(m[2]??1);return d&&Number.isSafeInteger(n)&&Number.isSafeInteger(d)?n/d:null}return /^[+-]?\d+\.\d+$/.test(s)?Number(s):null}
function factorCheck(s){let parts=s.replace(/²/g,'^2').replace(/³/g,'^3').normalize('NFKC').replace(/[×・·＊]/g,'*').replace(/\s/g,'').split('*'),got=[];for(const part of parts){let m=part.match(/^(\d+)(?:\^(\d+))?$/);if(!m)return false;let p=Number(m[1]),k=Number(m[2]??1);if(p<2||p>500||k<1||k>9||factors(p).length!==1)return false;for(let i=0;i<k;i++)got.push(p)}return got.sort((a,b)=>a-b).join(',')===current.answer.join(',')}
function check(s){if(current.kind==='factor')return factorCheck(s);if(current.kind==='rationalOnly'&&!s.includes('/'))return false;let val=parse(s);if(val===null)return false;let expected=(current.kind==='fraction'||current.kind==='rationalOnly')?current.answer.n/current.answer.d:current.answer;return Math.abs(val-expected)<1e-10}
function shuffle(a){for(let i=a.length-1;i>0;i--){let k=R(0,i);[a[i],a[k]]=[a[k],a[i]]}return a}
function showChoices(){E.choices.replaceChildren();let reverse=current.kind!=='rationalOnly',pool=decimals.slice(0,level===1?5:level===2?9:11),answer=answerText();let candidates=pool.map(row=>({label:reverse?row[0]:`${row[1]}/${row[2]}`,value:row[1]/row[2]})).filter(x=>x.label!==answer);let target=reverse?current.answer:current.answer.n/current.answer.d;candidates.sort((a,b)=>Math.abs(a.value-target)-Math.abs(b.value-target));let distractors=shuffle(candidates.slice(0,Math.min(candidates.length,5))).slice(0,3);for(const label of shuffle([answer,...distractors.map(x=>x.label)])){let button=document.createElement('button');button.type='button';button.className='choice';button.dataset.value=label;mathText(button,label);button.addEventListener('click',()=>choose(button,label));E.choices.append(button)}}
function choose(button,label){if(done)return;if(check(label)){done=true;correct++;progress();button.classList.add('correct');for(const b of E.choices.children)b.disabled=true;E.feedback.className='feedback good';E.feedback.textContent='正解！';let small=document.createElement('small');mathText(small,current.explain);E.feedback.append(small)}else{button.classList.add('wrong');button.disabled=true;E.feedback.className='feedback bad';E.feedback.textContent='もう一度選んでみましょう。'}}
function answerText(){return Array.isArray(current.answer)?current.answer.join('×'):(current.kind==='fraction'||current.kind==='rationalOnly')?S(current.answer):String(current.answer)}
function progress(){E.score.textContent=`${index+1} / 10 問　正解 ${correct}`;for(const b of document.querySelectorAll('.level'))b.setAttribute('aria-pressed',String(Number(b.dataset.level)===level))}
function next(){let candidate;for(let i=0;i<30;i++){candidate=mode.make(level);if(!seen.has((candidate.context||'')+'|'+candidate.text))break}current=candidate;seen.add((candidate.context||'')+'|'+candidate.text);done=false;mathText(E.context,current.context||'');E.context.hidden=!current.context;E.prompt.textContent=mode===modes.factor?'素因数分解しましょう':'答えを求めましょう';mathText(E.question,current.text);E.input.value='';E.input.disabled=false;for(const b of E.primePad.querySelectorAll('button'))b.disabled=false;E.feedback.textContent='';E.feedback.className='feedback';E.choices.hidden=mode!==modes.convert;E.primePad.hidden=mode!==modes.factor;E.form.hidden=mode===modes.convert;if(mode===modes.convert)showChoices();progress();if(mode!==modes.convert&&mode!==modes.factor)E.input.focus()}
function finish(){E.area.hidden=true;E.result.hidden=false;E.resultTitle.textContent=`10問終了　${correct}問正解`;E.resultDetail.textContent=`答えを見た・正解せずに進んだ問題：${missed}問`;E.retry.focus()}
function advance(){if(!done)missed++;if(index===9){finish();return}index++;next()}
function start(id){mode=modes[id];index=correct=missed=0;seen=new Set();E.title.textContent=mode.title;mathText(E.description,mode.desc);E.input.placeholder=id==='factor'?'素数ボタンを押してください':id==='parabola'?'分数は分子/分母で入力':'答えを入力';E.input.readOnly=id==='factor';E.input.setAttribute('inputmode',id==='factor'?'none':'decimal');E.area.hidden=false;E.result.hidden=true;next()}
function navigate(view,push=true){if(!(view in modes)&&view!=='tips')view='home';E.home.hidden=view!=='home';E.practice.hidden=!(view in modes);E.tips.hidden=view!=='tips';if(view in modes)start(view);if(push)history.pushState({view},'',view==='home'?location.pathname:'#'+view);window.scrollTo(0,0)}
E.primePad.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||done)return;if(b.dataset.prime){E.input.value+=`${E.input.value?' × ':''}${b.dataset.prime}`}else if(b.dataset.primeAction==='undo'){E.input.value=E.input.value.split(' × ').slice(0,-1).join(' × ')}else if(b.dataset.primeAction==='clear'){E.input.value=''}E.feedback.textContent='';E.feedback.className='feedback'});
E.form.addEventListener('submit',e=>{e.preventDefault();if(done){advance();return}let s=E.input.value.trim();if(!s)return;if(check(s)){done=true;correct++;progress();E.feedback.className='feedback good';E.feedback.textContent='正解！';let small=document.createElement('small');mathText(small,current.explain);E.feedback.append(small);if(mode===modes.factor)for(const b of E.primePad.querySelectorAll('button'))b.disabled=true}else{E.feedback.className='feedback bad';E.feedback.textContent='もう一度考えてみましょう。'}});
E.next.addEventListener('click',advance);E.reveal.addEventListener('click',()=>{if(!done){done=true;missed++}E.feedback.className='feedback';mathText(E.feedback,'答え：'+answerText());let small=document.createElement('small');mathText(small,current.explain);E.feedback.append(small);E.input.disabled=true;if(mode===modes.factor)for(const b of E.primePad.querySelectorAll('button'))b.disabled=true;if(mode===modes.convert){for(const b of E.choices.children){if(check(b.dataset.value))b.classList.add('correct');b.disabled=true}}});E.retry.addEventListener('click',()=>start(Object.keys(modes).find(id=>modes[id]===mode)));for(const b of document.querySelectorAll('.level'))b.addEventListener('click',()=>{level=Number(b.dataset.level);start(Object.keys(modes).find(id=>modes[id]===mode))});for(const b of document.querySelectorAll('[data-open]'))b.addEventListener('click',()=>navigate(b.dataset.open));window.addEventListener('popstate',()=>navigate(location.hash.slice(1),false));navigate(location.hash.slice(1),false);
})();
</script></body></html>
