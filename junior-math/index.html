<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102744"><title>中1 計算トレーニング</title><meta name="description" content="19×19までの暗算、素因数分解、計算の工夫を練習するサイト"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102744'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='40' font-family='sans-serif' fill='%23f9c85b'%3E×%3C/text%3E%3C/svg%3E"><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#152d46;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{background:#102744;color:white;padding:20px max(20px,calc((100vw - 1000px)/2))}header strong{font-size:1.25rem;letter-spacing:.03em}main{max-width:1000px;margin:auto;padding:25px 18px 55px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}.tab{border:2px solid #d3e0ed;background:white;color:#24405d;border-radius:14px;padding:14px 10px;font-weight:750}.tab[aria-selected=true]{border-color:#1b6eb2;background:#e3f3ff;color:#10518d}.panel{background:white;border:1px solid #dce6ee;box-shadow:0 12px 32px #1432540a;border-radius:22px;padding:clamp(20px,4vw,38px)}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(1.4rem,3vw,2rem);margin:0}p{line-height:1.65}.hint{color:#526b82;margin:10px 0 20px}.badge{background:#eef4fa;color:#355b7b;border-radius:100px;padding:8px 14px;font-weight:650}.card{background:#f7fafe;border:1px solid #deebf5;border-radius:18px;padding:clamp(20px,4vw,36px);margin:20px 0}.question{font-size:clamp(2rem,6vw,3.5rem);font-weight:800;line-height:1.35;min-height:1.5em;font-variant-numeric:tabular-nums}.prompt{color:#45627d;font-size:.95rem;margin-bottom:8px}.work{color:#44627a;min-height:1.5em;margin-top:12px}.answer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.answer input{width:min(100%,260px);border:2px solid #a9bfd2;border-radius:12px;padding:14px 16px;font-size:1.35rem;font-variant-numeric:tabular-nums}.answer input:focus{outline:3px solid #a9ddff;outline-offset:2px}.primary,.secondary{border:0;border-radius:12px;padding:15px 21px;font-weight:750;min-height:52px}.primary{background:#1367aa;color:white}.secondary{background:#e9f1f8;color:#1c517c}.primary:hover{background:#0e568e}.secondary:hover{background:#dcebf6}.feedback{min-height:57px;margin:14px 0 4px;font-weight:700}.feedback.good{color:#126544}.feedback.bad{color:#ae3f26}.feedback small{display:block;font-size:.95rem;font-weight:500;color:#38566d;margin-top:5px}.actions{display:flex;gap:10px;flex-wrap:wrap}.guide{border-top:1px solid #e1eaf2;margin-top:28px;padding-top:15px;color:#38546c}.guide h2{font-size:1.05rem;color:#173751}.guide ul{padding-left:1.4em;line-height:1.8}.guide li{margin:4px 0}footer{color:#5a7085;text-align:center;padding:0 18px 28px;font-size:.9rem}@media(max-width:620px){.tabs{grid-template-columns:1fr}.tab{text-align:left;padding:12px 16px}.panel{padding:20px}.answer input{flex:1;min-width:150px}.answer .primary{flex:1}.question{overflow-wrap:anywhere}}
</style></head><body><header><strong>中1 計算トレーニング</strong></header><main><nav class="tabs" aria-label="練習分野"><button class="tab" type="button" data-mode="multiply" aria-selected="true">19×19までの暗算</button><button class="tab" type="button" data-mode="factor" aria-selected="false">素因数分解</button><button class="tab" type="button" data-mode="decimal" aria-selected="false">計算の工夫</button></nav><section class="panel" aria-labelledby="title"><div class="topline"><h1 id="title"></h1><span class="badge" id="score" aria-live="polite"></span></div><p class="hint" id="description"></p><div class="card"><div class="prompt" id="prompt"></div><div class="question" id="question"></div><div class="work" id="work"></div></div><form id="form" class="answer" autocomplete="off"><input id="input" type="text" inputmode="numeric" aria-label="答え" spellcheck="false"><button class="primary" type="submit">答え合わせ</button></form><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions"><button id="next" class="secondary" type="button">次の問題</button><button id="reveal" class="secondary" type="button">答えを見る</button></div><div class="guide" id="guide"></div></section></main><footer>入力した答えや記録は送信されません。</footer><script>
(()=>{'use strict';const $=id=>document.getElementById(id),els={title:$('title'),score:$('score'),description:$('description'),prompt:$('prompt'),question:$('question'),work:$('work'),input:$('input'),feedback:$('feedback'),next:$('next'),reveal:$('reveal'),form:$('form'),guide:$('guide')};let mode='multiply',current=null,correct=0,attempted=0,done=false,previous='';const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rand(0,a.length-1)],shuffle=a=>a.sort(()=>Math.random()-.5);const decimals=[25,75,125,375,625,875],format=n=>Number.isInteger(n)?String(n):String(n);const hints={25:'0.25＝1/4',75:'0.75＝3/4',125:'0.125＝1/8',375:'0.375＝3/8',625:'0.625＝5/8',875:'0.875＝7/8'};const settings={multiply:{title:'19×19までの暗算',description:'1〜19の整数どうしの掛け算です。暗算で答えてみましょう。',prompt:'積を求めましょう',guide:'<h2>暗算のヒント</h2><ul><li>たとえば 17×8 は、(10×8)＋(7×8) に分けられます。</li><li>19×19 は、(20−1)×19 と考えることもできます。</li></ul>'},factor:{title:'素因数分解',description:'2〜3桁の整数を素数の積で表しましょう。',prompt:'素因数分解しましょう',guide:'<h2>入力のしかた</h2><ul><li>「2×2×3×5」のように入力します。「2^2×3×5」や「2²×3×5」でも正解になります。</li><li>掛ける順番は自由です。分解せず元の数だけを書くと正解になりません。</li></ul>'},decimal:{title:'計算の工夫',description:'0.25・0.75・0.125・0.375・0.625・0.875を分数に直して考えましょう。',prompt:'工夫して計算しましょう',guide:'<h2>計算のヒント</h2><ul><li>0.25＝1/4、0.75＝3/4 です。</li><li>0.125＝1/8、0.375＝3/8、0.625＝5/8、0.875＝7/8 です。</li><li>たとえば 0.375×16＝(3/8)×16＝6 となります。</li></ul>'}};function factors(n){let a=[];for(let d=2;d*d<=n;d++)while(n%d===0){a.push(d);n/=d}if(n>1)a.push(n);return a}function make(){let q;if(mode==='multiply'){let a=rand(2,19),b=rand(2,19);q={text:`${a} × ${b}`,answer:a*b,explain:`${a} × ${b} ＝ ${a*b}`}}else if(mode==='factor'){let primes=[2,3,5,7,11,13],n,fs;do{fs=[];n=1;for(let i=0;i<rand(2,4);i++){let candidates=primes.filter(p=>p*n<=360);if(!candidates.length)break;let p=pick(candidates);fs.push(p);n*=p}}while(n<24||fs.length<2);fs.sort((a,b)=>a-b);q={text:String(n),answer:fs,explain:`${n} ＝ ${fs.join(' × ')}`}}else{let d=pick(decimals),den=d===25||d===75?4:8,num=d===25?1:d===75?3:d===125?1:d===375?3:d===625?5:7;let k=rand(1,5),whole=den*k;let reversed=Math.random()<.5;q={text:reversed?`${whole} × ${'0.'+String(d).padStart(3,'0')}`:`${'0.'+String(d).padStart(3,'0')} × ${whole}`,answer:num*k,explain:`${hints[d]} なので、${num}/${den} × ${whole} ＝ ${num*k}`};if(d===25||d===75)q.text=q.text.replace('0.025','0.25').replace('0.075','0.75')}return q}function normalized(s){return s.normalize('NFKC').replace(/[−ー－]/g,'-').replace(/，/g,',').trim()}function checkFactor(s){s=normalized(s).replace(/[×・·＊*]/g,'*').replace(/[²]/g,'^2').replace(/[³]/g,'^3').replace(/\s+/g,'');if(!/^\d+(?:\^\d+)?(?:\*\d+(?:\^\d+)?)*$/.test(s))return false;let found=[];for(const term of s.split('*')){let [base,exponent='1']=term.split('^'),p=Number(base),count=Number(exponent);if(!Number.isSafeInteger(p)||!Number.isSafeInteger(count)||count<1||count>10||factors(p).length!==1||p>360)return false;for(let i=0;i<count;i++)found.push(p)}return found.sort((a,b)=>a-b).join(',')===current.answer.join(',')}function next(){let q;do{q=make()}while(q.text===previous);current=q;previous=q.text;done=false;els.question.textContent=q.text;els.work.textContent='';els.input.value='';els.input.disabled=false;els.feedback.textContent='';els.feedback.className='feedback';els.input.focus()}function setMode(m){mode=m;correct=attempted=0;previous='';for(const b of document.querySelectorAll('.tab'))b.setAttribute('aria-selected',String(b.dataset.mode===m));let s=settings[m];els.title.textContent=s.title;els.description.textContent=s.description;els.prompt.textContent=s.prompt;els.guide.innerHTML=s.guide;els.input.setAttribute('inputmode',m==='factor'?'text':'numeric');els.input.placeholder=m==='factor'?'例：2×2×3':'答えを入力';score();next()}function score(){els.score.textContent=`正解 ${correct} / ${attempted} 問`}function result(good){els.feedback.className='feedback '+(good?'good':'bad');els.feedback.textContent=good?'正解！':'もう一度考えてみましょう。';if(good){done=true;attempted++;correct++;score();let small=document.createElement('small');small.textContent=current.explain;els.feedback.appendChild(small)}}els.form.addEventListener('submit',e=>{e.preventDefault();if(done){next();return}let s=normalized(els.input.value);if(!s)return;let good=mode==='factor'?checkFactor(s):/^-?\d+(?:\.\d+)?$/.test(s)&&Number(s)===current.answer;result(good)});els.next.addEventListener('click',()=>{if(!done){attempted++;score()}next()});els.reveal.addEventListener('click',()=>{if(!done){attempted++;done=true;score()}els.feedback.className='feedback';els.feedback.textContent='答え：'+current.explain;els.input.disabled=true});for(const b of document.querySelectorAll('.tab'))b.addEventListener('click',()=>setMode(b.dataset.mode));setMode('multiply')})();
</script></body></html>
